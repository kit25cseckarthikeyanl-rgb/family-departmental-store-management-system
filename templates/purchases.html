{% extends "base.html" %}{% block body %}<h1>Purchase Entry</h1><div class="panel"><form method="post" class="grid"><div><label>Supplier name</label><input name="supplier" required></div><div><label>Product</label><select name="product_id">{% for p in ps %}<option value="{{p.id}}">{{p.name}} — cost ₹{{'%.2f'|format(p.cost)}}</option>{% endfor %}</select></div><div><label>Quantity received</label><input name="qty" type="number" min="1" required></div><button>Record purchase</button></form></div><div class="panel"><h2>Purchase history</h2><table><tr><th>ID</th><th>Supplier</th><th>Date</th><th>Total</th></tr>{% for p in rows %}<tr><td>{{p.id}}</td><td>{{p.supplier}}</td><td>{{p.date}}</td><td>₹{{'%.2f'|format(p.total)}}</td></tr>{% else %}<tr><td colspan="4">No purchases yet.</td></tr>{% endfor %}</table></div>{% endblock %}
