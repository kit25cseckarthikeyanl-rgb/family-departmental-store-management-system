{% extends "base.html" %}{% block body %}<h1>Suppliers</h1><div class="panel"><h2>Add supplier</h2><form method="post" class="grid"><div><label>Name</label><input name="name" required></div><div><label>Phone (optional)</label><input name="phone"></div><div><label>Address (optional)</label><input name="address"></div><button>Save supplier</button></form></div><div class="panel"><table><tr><th>Name</th><th>Phone</th><th>Address</th></tr>{% for s in rows %}<tr><td>{{s.name}}</td><td>{{s.phone}}</td><td>{{s.address}}</td></tr>{% else %}<tr><td colspan="3">No suppliers yet.</td></tr>{% endfor %}</table></div>{% endblock %}
