{% extends "base.html" %}{% block body %}<h1>Sales Billing</h1><div class="panel"><form method="post" id="form"><div id="lines"><div class="line"><div><label>Product</label><select name="pid" required>{% for p in ps %}<option value="{{p.id}}">{{p.name}} — ₹{{'%.2f'|format(p.price)}} (stock {{p.quantity}})</option>{% endfor %}</select></div><div><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div></div></div><button type="button" class="secondary" onclick="addLine()">+ Add item</button><label>Payment method</label><select name="payment"><option>Cash</option><option>UPI</option><option>Card</option></select><p><button>Complete sale & create receipt</button></p></form></div><script>function addLine(){let x=document.querySelector('.line').cloneNode(true);x.querySelector('input').value=1;document.querySelector('#lines').appendChild(x)}</script>{% endblock %}
