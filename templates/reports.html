{% extends "base.html" %}{% block body %}<h1>Sales Reports</h1><div class="panel"><h2>Total recorded sales: ₹{{'%.2f'|format(total)}}</h2><table><tr><th>Bill</th><th>Date</th><th>Cashier</th><th>Payment</th><th>Total</th><th>Receipt</th></tr>{% for s in rows %}<tr><td>{{s.id}}</td><td>{{s.date}}</td><td>{{s.cashier}}</td><td>{{s.payment}}</td><td>₹{{'%.2f'|format(s.total)}}</td><td><a href="/receipt/{{s.id}}">View</a></td></tr>{% else %}<tr><td colspan="6">No sales yet.</td></tr>{% endfor %}</table></div>{% endblock %}
